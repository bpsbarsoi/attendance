<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Attendance - Barsoi Public School</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; padding: 10px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 1100px; margin: auto; }
        h2 { color: #2e7d32; text-align: center; margin-bottom: 5px; }
        
        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
        select, input, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; outline: none; }
        button { background: #2e7d32; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #1b5e20; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th { background: #e8f5e9; color: #2e7d32; padding: 10px; border: 1px solid #c8e6c9; text-align: left; white-space: nowrap; }
        td { padding: 8px; border: 1px solid #eee; text-align: left; white-space: nowrap; }
        
        .status-p { color: #2e7d32; font-weight: bold; }
        .status-a { color: #d32f2f; font-weight: bold; }
        .status-off { color: #555; background: #f0f0f0; font-style: italic; font-weight: bold; }
        .view-btn { cursor: pointer; color: #1565c0; background: #e3f2fd; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; border: 1px solid #90caf9; }
        .view-btn:hover { background: #bbdefb; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; flex-direction: column; }
        .modal-content { max-width: 85%; max-height: 75vh; border-radius: 12px; border: 3px solid white; box-shadow: 0 5px 25px rgba(0,0,0,0.5); object-fit: contain; }
        .close-modal { position: absolute; top: 20px; right: 25px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>Barsoi Public School</h2>
    <p style="text-align:center; font-weight:bold; color:#555; margin-top:0;">Monthly Attendance Report</p>
    
    <div class="filters">
        <select id="classList" onchange="loadStaff()">
            <option value="1">Teachers</option>
            <option value="2">Non-Teaching Staffs</option>
        </select>
        <select id="sList"><option value="">Loading...</option></select>
        <input type="month" id="monthPicker">
        <button onclick="generateMonthlyReport()">Show Report</button>
    </div>

    <div class="table-container">
        <table id="reportTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Day</th>
                    <th>Status</th>
                    <th>In Time</th>
                    <th>Out Time</th>
                    <th>In Loc</th>
                    <th>Out Loc</th>
                    <th>In Photo</th>
                    <th>Out Photo</th>
                    <th>Duration</th>
                </tr>
            </thead>
            <tbody id="reportBody">
                <tr><td colspan="10" style="text-align:center; color:#777;">Select Category, Staff Name and Month then click 'Show Report'.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="photoModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img id="modalImg" class="modal-content" src="">
</div>

<script>
    // Aapki Nayi Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeXAtB23focDvjxMPqt7fcFL3eUlp6ofXRg0Zs_4v65OpYn4Vti2TCKqHjRbepROgDng/exec"; 

    window.onload = () => {
        document.getElementById('monthPicker').value = new Date().toISOString().slice(0, 7);
        loadStaff();
    };

    function loadStaff() {
        let cid = document.getElementById('classList').value;
        let sl = document.getElementById('sList');
        sl.innerHTML = "<option>Loading...</option>";

        fetch(SCRIPT_URL + "?classId=" + cid)
        .then(r => r.json())
        .then(data => {
            sl.innerHTML = "";
            data.forEach(item => {
                let tName = item.name || (Array.isArray(item) ? item[0] : item);
                if (tName) {
                    sl.innerHTML += `<option value="${tName}">${tName}</option>`;
                }
            });
            if(sl.innerHTML === "") sl.innerHTML = "<option value=''>No Staff Found</option>";
        })
        .catch(err => {
            sl.innerHTML = "<option value=''>Error Loading Data</option>";
        });
    }

    function openPhoto(id) {
        if(!id || id === '' || id === 'undefined') return;
        document.getElementById('modalImg').src = `https://lh3.googleusercontent.com/d/${id}`;
        document.getElementById('photoModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('photoModal').style.display = 'none';
        document.getElementById('modalImg').src = "";
    }

    async function generateMonthlyReport() {
        let cid = document.getElementById('classList').value;
        let staffName = document.getElementById('sList').value;
        let monthVal = document.getElementById('monthPicker').value;
        let tbody = document.getElementById('reportBody');

        if (!staffName) { alert("Kripya Staff Name select karein!"); return; }
        if (!monthVal) { alert("Kripya Month select karein!"); return; }

        let [year, month] = monthVal.split('-');
        
        tbody.innerHTML = "<tr><td colspan='10' style='text-align:center;'>Loading Monthly Data... ⏳</td></tr>";

        try {
            let logs = await fetch(`${SCRIPT_URL}?getAttendance=true&classId=${cid}&name=${encodeURIComponent(staffName)}`).then(r => r.json());

            tbody.innerHTML = "";
            let daysInMonth = new Date(year, month, 0).getDate();
            let today = new Date();
            today.setHours(0,0,0,0);

            for (let day = 1; day <= daysInMonth; day++) {
                let d = new Date(year, month - 1, day);
                let dayFormatted = String(day).padStart(2, '0');
                let dateStrDDMMYYYY = `${dayFormatted}/${month}/${year}`; // DD/MM/YYYY
                let dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
                
                // Matching Google Script Date format (dd/MM/yyyy)
                let record = logs.find(l => {
                    if (!l[1]) return false;
                    let recDateStr = l[1].split(' ')[0]; // Gets dd/MM/yyyy
                    return recDateStr === dateStrDDMMYYYY;
                });
                
                let tr = document.createElement('tr');
                
                if (d.getDay() === 0) { // Sunday
                    tr.innerHTML = `
                        <td>${dateStrDDMMYYYY}</td>
                        <td>${dayName}</td>
                        <td class="status-off">Week Off</td>
                        <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    `;
                } 
                else if (record) { // Present
                    let inPhotoId = record[6] || "";
                    let outPhotoId = record[7] || "";

                    tr.innerHTML = `
                        <td>${dateStrDDMMYYYY}</td>
                        <td>${dayName}</td>
                        <td class="status-p">Present</td>
                        <td>${record[1] ? record[1].split(' ')[1] + ' ' + (record[1].split(' ')[2] || '') : '-'}</td>
                        <td>${record[2] ? (record[2].includes(' ') ? record[2].split(' ')[1] + ' ' + (record[2].split(' ')[2] || '') : record[2]) : '-'}</td>
                        <td>${record[3] || '-'}</td>
                        <td>${record[4] || '-'}</td>
                        <td>${inPhotoId ? `<span class="view-btn" onclick="openPhoto('${inPhotoId}')">👁️ In Photo</span>` : '-'}</td>
                        <td>${outPhotoId ? `<span class="view-btn" onclick="openPhoto('${outPhotoId}')">👁️ Out Photo</span>` : '-'}</td>
                        <td>${record[5] || '-'}</td>
                    `;
                } 
                else if (d < today) { // Past Date Absent
                    tr.innerHTML = `
                        <td>${dateStrDDMMYYYY}</td>
                        <td>${dayName}</td>
                        <td class="status-a">Absent</td>
                        <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    `;
                }
                else { // Future Date
                    tr.innerHTML = `
                        <td>${dateStrDDMMYYYY}</td>
                        <td>${dayName}</td>
                        <td style="color:#888;">-</td>
                        <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    `;
                }
                tbody.appendChild(tr);
            }
        } catch(err) {
            console.error(err);
            tbody.innerHTML = "<tr><td colspan='10' style='text-align:center; color:red;'>Data load failed. Check URL or network!</td></tr>";
        }
    }
</script>
</body>
</html>
